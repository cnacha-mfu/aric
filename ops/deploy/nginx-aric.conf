# ARIC website + ARIC OS on the ARIC VM (installed by ops/deploy/install.sh as /etc/nginx/sites-available/aric)
# Public address: https://aric.mfu.ac.th (MFU front proxy, *.mfu.ac.th certificate) -> this VM on port 80.
# Static files: a clone of github.com/cnacha-mfu/aric at /var/www/aric, auto-pulled every 5 min by aric-sync.timer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/aric;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    location ~ /\.git { deny all; return 404; }
    location ^~ /ops/ { return 404; }            # ARIC OS code and deploy files are not served

    # ARIC OS: back office and API (ops/server.py on 127.0.0.1:8090, systemd unit aric-os.service)
    location = /os { return 301 /os/; }
    location ^~ /os/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 300k;
    }
    location ^~ /aric/os { return 301 /os/; }
    location = /challenge { return 301 /challenge/; }

    # same URLs as the old GitHub Pages site: /aric/, /aric/interns/, /aric/challenge/
    location = /aric { return 301 /aric/; }
    location = /aric/interns { return 301 /aric/interns/; }
    location = /aric/challenge { return 301 /aric/challenge/; }
    location ^~ /aric/ {
        rewrite ^/aric/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|svg|mp4|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
    }
}
